<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque - Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="cabecalho">
            <h1>Gestão de Estoque</h1>
            <button class="btn-voltar" onclick="voltarParaPrincipal()">← Voltar</button>
        </header>

        <main class="conteudo-principal">
            <div class="secao-movimentacao">
                <h2>Registrar Movimentação de Estoque</h2>
                <form id="formMovimentacao" class="formulario-produto">
                    <div class="linha-formulario">
                        <div class="campo-formulario">
                            <label for="produtoSelecionado">Selecionar Produto: *</label>
                            <select id="produtoSelecionado" name="produtoSelecionado" required>
                                <option value="">Selecione um produto...</option>
                            </select>
                        </div>

                        <div class="campo-formulario">
                            <label for="tipoMovimentacao">Tipo de Movimentação: *</label>
                            <select id="tipoMovimentacao" name="tipoMovimentacao" required>
                                <option value="">Selecione...</option>
                                <option value="ENTRADA">Entrada</option>
                                <option value="SAIDA">Saída</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-formulario">
                        <div class="campo-formulario">
                            <label for="quantidadeMovimentacao">Quantidade: *</label>
                            <input type="number" id="quantidadeMovimentacao" name="quantidadeMovimentacao" required min="0.01" step="0.01" placeholder="0.00">
                        </div>

                        <div class="campo-formulario">
                            <label for="dataMovimentacao">Data da Movimentação: *</label>
                            <input type="date" id="dataMovimentacao" name="dataMovimentacao" required>
                        </div>
                    </div>

                    <div class="campo-formulario">
                        <label for="observacaoMovimentacao">Observação:</label>
                        <textarea id="observacaoMovimentacao" name="observacaoMovimentacao" rows="3" placeholder="Informações sobre a movimentação"></textarea>
                    </div>

                    <div class="botoes-formulario">
                        <button type="submit" class="btn-salvar">Registrar Movimentação</button>
                        <button type="button" class="btn-cancelar" onclick="limparFormularioMovimentacao()">Limpar</button>
                    </div>
                </form>

                <div id="mensagensMovimentacao" class="mensagens-validacao"></div>
            </div>

            <div class="secao-listagem">
                <h2>Produtos Cadastrados (Ordem Alfabética)</h2>
                <div class="tabela-container">
                    <table id="tabelaProdutosEstoque" class="tabela-produtos">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Quantidade Atual</th>
                                <th>Estoque Mínimo</th>
                                <th>Unidade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaEstoque">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
